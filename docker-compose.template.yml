services:
  auto-m4b:
    image: brandonscript/auto-m4b
    # build: .  # uncomment to build locally instead of pulling from Docker Hub
    container_name: auto-m4b
    restart: unless-stopped
    volumes:
      - /path/to/inbox:/data/inbox
      - /path/to/converted:/data/converted
      - /path/to/archive:/data/archive
      - /path/to/backup:/data/backup
      # Optional: mount custom post-convert scripts
      # - /path/to/scripts:/scripts:ro
    environment:
      - INBOX_FOLDER=/data/inbox
      - CONVERTED_FOLDER=/data/converted
      - ARCHIVE_FOLDER=/data/archive
      - BACKUP_FOLDER=/data/backup
      - TZ=America/Vancouver  # your timezone
      # - SLEEP_TIME=10
      # - BACKUP=Y
      # - OVERWRITE_EXISTING=N
      # - ON_COMPLETE=archive
      # - CLEANUP_FILENAMES=N
      # - SCORER_TRACE=N
      # - OPEN_LIBRARY_TIMEOUT=30
      # - GOODSCRAPS_USER_AGENT=auto-m4b/1.0 (you@example.com)
      # - GOODSCRAPS_TIMEOUT=30
      # - MAX_BITRATE=64
      # - POST_CONVERT_SCRIPT=/scripts/post-convert-deluge.py
      # - POST_CONVERT_SCRIPT_TIMEOUT=30
