name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Unit & integration tests (fast, required to merge) ───────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout path-dependency siblings
        working-directory: ..
        run: |
          # pyproject path deps resolve as ../goodscraps, ../bookpeek, ../fixm4b
          for repo in goodscraps bookpeek fixm4b; do
            if [ ! -d "$repo" ]; then
              git clone --depth 1 "https://github.com/brandonscript/${repo}.git" "$repo"
            fi
          done

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv + spaCy model
        id: cache-venv
        uses: actions/cache@v5
        with:
          path: |
            .venv
            ~/nltk_data
          key: venv-v4-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Download spaCy model
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: poetry run python -m spacy download en_core_web_sm

      - name: Download NLTK data
        run: |
          poetry run python -c "
          import nltk
          for pkg in ('popular', 'words', 'punkt_tab', 'averaged_perceptron_tagger_eng', 'maxent_ne_chunker_tab'):
              nltk.download(pkg, quiet=False)
          "

      - name: Run unit & integration tests
        run: |
          poetry run python -m pytest src/tests/ \
            --ignore=src/tests/test_converter_e2e.py \
            --ignore=src/tests/test__e2e_happy_paths.py \
            --ignore=src/tests/test__e2e_series.py \
            --ignore=src/tests/test__e2e_standalone_and_single.py \
            --ignore=src/tests/test__e2e_unhappy_paths.py \
            --deselect="src/tests/test_id3_tags.py::test_verify_tags_after_convert[touch_of_frost__flat_mp3-expected_dict0]" \
            --deselect="src/tests/test_id3_tags.py::test_verify_tags_after_convert[count_of_monte_cristo__flat_mp3-expected_dict1]" \
            --deselect="src/tests/test_id3_tags.py::test_verify_tags_after_convert[house_on_the_cliff__flat_mp3-expected_dict2]" \
            --deselect="src/tests/test_id3_tags.py::test_parse_combo_id3_tags[test_dict10-test_dict20-expected0]" \
            --deselect="src/tests/test_id3_tags.py::test_ignore_graphic_audio" \
            --deselect="src/tests/test_id3_tags.py::test_parse_id3_author[test_dict4-Sarah J. Maas]" \
            --deselect="src/tests/test_parsers.py::test_extract_path_info[Trenton Lee Stewart-fs_author-benedict_society__mp3]" \
            -q --tb=short -x

  # ── End-to-end converter tests (slow, runs in parallel, required to merge) ───
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout path-dependency siblings
        working-directory: ..
        run: |
          # pyproject path deps resolve as ../goodscraps, ../bookpeek, ../fixm4b
          for repo in goodscraps bookpeek fixm4b; do
            if [ ! -d "$repo" ]; then
              git clone --depth 1 "https://github.com/brandonscript/${repo}.git" "$repo"
            fi
          done

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv + spaCy model
        id: cache-venv
        uses: actions/cache@v5
        with:
          path: |
            .venv
            ~/nltk_data
          key: venv-v4-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Download spaCy model
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: poetry run python -m spacy download en_core_web_sm

      - name: Download NLTK data
        run: |
          poetry run python -c "
          import nltk
          for pkg in ('popular', 'words', 'punkt_tab', 'averaged_perceptron_tagger_eng', 'maxent_ne_chunker_tab'):
              nltk.download(pkg, quiet=False)
          "

      - name: Run e2e tests
        run: |
          poetry run python -m pytest \
            src/tests/test_converter_e2e.py \
            src/tests/test__e2e_happy_paths.py \
            src/tests/test__e2e_series.py \
            src/tests/test__e2e_standalone_and_single.py \
            src/tests/test__e2e_unhappy_paths.py \
            --deselect="src/tests/test__e2e_unhappy_paths.py::test_unhappy_paths::test_no_matches_found" \
            --deselect="src/tests/test__e2e_unhappy_paths.py::test_unhappy_paths::test_skips_failed_when_new_books_added[True]" \
            --deselect="src/tests/test__e2e_unhappy_paths.py::test_unhappy_paths::test_skips_failed_when_new_books_added[False]" \
            --deselect="src/tests/test__e2e_unhappy_paths.py::test_unhappy_paths::test_ignore_failed_if_unchanged" \
            --deselect="src/tests/test__e2e_happy_paths.py::test_happy_paths::test_friendly_message_when_inbox_is_empty" \
            -q --tb=short -x

  # ── Docker Hub publish (only after all tests pass, only on main + version tags) ─
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [test, test-e2e]
    if: |
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: brandonscript/auto-m4b
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Hub overview can render README images, but only with absolute URLs.
      - name: Update Docker Hub description
        # A valid image push should not fail CI when the token lacks Hub
        # repository-description permission.
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: brandonscript/auto-m4b
          short-description: Python audiobook converter for chapterized M4B files.
          readme-filepath: ./README.md
          enable-url-completion: true
