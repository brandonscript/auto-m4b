name: phantom

include:
  - ../docker-compose.networks.yml
  - ../docker-compose.volumes.yml

services:
  auto-m4b-base:
    build:
      context: /etc/docker/auto-m4b
      dockerfile: Dockerfile.base
    image: auto-m4b-base:latest
    profiles:
      - base

  auto-m4b:
    build:
      context: /etc/docker/auto-m4b
    container_name: auto-m4b
    restart: unless-stopped
    volumes:
      - ragnarok-media:/media:rw
    networks:
      - bridge
    environment:
      - INBOX_FOLDER=/media/Books/Audiobooks/#auto-m4b/inbox
      - CONVERTED_FOLDER=/media/Books/Audiobooks/#auto-m4b/converted
      - ARCHIVE_FOLDER=/media/Books/Audiobooks/#auto-m4b/archive
      - FAILED_FOLDER=/media/Books/Audiobooks/#auto-m4b/failed
      - BACKUP_FOLDER=/media/Books/Audiobooks/#auto-m4b/backup
      - WORKING_FOLDER=/tmp/auto-m4b
      - OVERWRITE_EXISTING=N
      - BACKUP=N
      - ON_COMPLETE=archive
      - TZ=America/Vancouver
      - DEBUG=0
      # Open Library API user agent — required to enable author/narrator swap detection.
      # Format: AppName/1.0 (your@email.com)  See: https://openlibrary.org/developers/api
      - OPEN_LIBRARY_USER_AGENT=
      # Optional: set to a downloads folder to automatically copy new audiobooks
      # into the inbox. Only directories with more than one audio file are copied.
      - WATCH_FOLDER=/media/Downloads/books
